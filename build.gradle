plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly 'org.ow2.asm:asm-tree:9.8'
    // Intentionnel : aucune classe interne de Cobblemon / Myths liée à la compilation.
    // Les signatures sont documentées dans docs/COMPATIBILITY.md.
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: inputs.properties.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
